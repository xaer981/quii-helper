[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quii-helper"
version = "0.1.0"
description = "Python helpers for connecting to QUII-based cameras, capturing snapshots/video, and serving RTSP streams."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "cffi>=2.0.0",
    "cryptography>=46.0.7",
    "kcp>=0.1.6",
    "loguru>=0.7.3",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "coverage==7.6.12",
    "mypy==1.15.0",
    "pre-commit==4.3.0",
    "pytest==8.3.5",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quii_helper*"]

[tool.setuptools.package-data]
quii_helper = ["py.typed"]

[tool.black]
target-version = ["py310"]
line-length = 79

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
# Keep CI low-noise initially. Broader rule groups should be enabled package by
# package after fixing existing findings.
select = ["E9", "F63", "F7", "F82", "I"]

[tool.ruff.lint.isort]
known-first-party = ["quii_helper"]

