name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: windows-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Scan git history for secrets
        run: >
          go run github.com/zricethezav/gitleaks/v8@v8.30.1
          git --config .gitleaks.toml --redact --verbose .

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency check
        run: python -m pip check

      - name: Import smoke test
        run: python -c "from quii_helper import Camera; print(Camera.__name__)"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m black --check .

      - name: Type check
        run: python -m mypy

      - name: Strict type check stable packages
        run: python -m mypy quii_helper --strict --no-incremental

      - name: Test
        run: |
          python -m coverage run -m pytest
          python -m coverage report
