name: Bug report
description: Report a reproducible failure.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, `.env` contents, private keys, tokens, or raw APK assets.
        Use `LOG_LEVEL=debug` when possible and redact logs before sharing them.
  - type: input
    id: version
    attributes:
      label: quii-helper version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the public API call or example script used.
      placeholder: |
        1. Configure `.env` from the same app version.
        2. Run `python examples/save_video.py`.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted debug logs
      description: Paste only redacted logs. Do not include credentials or private assets.
      render: text
    validations:
      required: false
