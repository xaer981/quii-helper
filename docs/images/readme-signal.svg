    <text x="58" y="46" font-size="11" font-weight="700" letter-spacing="2" fill="#bcd6c8">QUII HELPER / PYTHON TOOLKIT</text>
    <text x="40" y="118" font-family="Georgia, serif" font-size="49" fill="#fff7e8">Make your intercom</text>
    <text x="40" y="178" font-family="Georgia, serif" font-size="49" fill="#fff7e8">part of your code.</text>
    <text x="42" y="222" font-size="15" fill="#bcd6c8">Local media. Explicit cloud access. One Python API.</text>
    <rect x="42" y="257" width="99" height="26" rx="13" fill="#edb86f"/>
    <text x="59" y="274" font-size="10" font-weight="700" fill="#19352b">LAN FIRST</text>
    <text x="160" y="274" font-size="11" letter-spacing="1.4" fill="#c2dbcd">RTSP / AUDIO / ARCHIVES</text>
  </g>
  <g fill="none" stroke="#a8c8b5" stroke-width="1.5">
    <circle cx="805" cy="155" r="115" opacity="0.12"/>
    <circle cx="805" cy="155" r="88" opacity="0.16"/>
    <rect x="660" y="78" width="87" height="144" rx="17" fill="#17372e"/>
    <circle cx="703.5" cy="115" r="20"/>
    <circle cx="703.5" cy="115" r="9" stroke="#edb86f" stroke-width="3"/>
