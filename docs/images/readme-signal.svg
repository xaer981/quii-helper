<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="338" viewBox="0 0 1080 338" role="img" aria-labelledby="title desc">
  <title id="title">Make your intercom part of your code</title>
  <desc id="desc">QUII Helper. Python and Qualvision. Camera and terminal connected by a local signal path.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#b0d9c5" opacity="0.13"/></pattern>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#102d26"/><stop offset="1" stop-color="#183b35"/></linearGradient>
  </defs>
  <rect width="1080" height="338" rx="14" fill="url(#surface)"/>
  <rect width="1080" height="338" rx="14" fill="url(#grid)"/>
  <path d="M0 309h1080" stroke="#9ec7af" stroke-opacity="0.16"/>
  <g font-family="Verdana, sans-serif">
