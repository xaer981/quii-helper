  <g font-family="Verdana, sans-serif" font-size="10" letter-spacing="2" fill="#bcd6c8">
    <text x="675" y="248">INTERCOM</text><text x="933" y="223">PYTHON</text>
    <text x="783" y="286" fill="#edb86f">YOUR NETWORK. YOUR CODE.</text>
